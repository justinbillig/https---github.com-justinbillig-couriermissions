<style>
:root{--orange:#E98600;--orange-dark:#C97300;--navy:#183044;--sky:#A3C8E1;--cream:#FFF6EA;--white:#FFFFFF;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--body:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--navy);background:var(--white);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.donate{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;font-family:var(--sans);font-weight:700;font-size:1.125rem;

  transition:background .15s ease,transform .15s ease;box-shadow:0 8px 24px -10px rgba(233,134,0,.8)}
.donate:hover{background:var(--orange-dark)}
.donate:active{transform:translateY(1px)}
.donate:focus-visible{outline:3px solid var(--navy);outline-offset:4px}
.photo{background:linear-gradient(135deg,#F3B866,#E98600);}
.photo img{width:100%;height:100%;object-fit:cover}
.photo img[data-missing]{display:none}
.foot{font-size:.875rem;color:rgba(24,48,68,.7);line-height:1.5}
.foot a{color:inherit}

body{background:var(--navy)}
.hero{position:relative;min-height:100%;display:flex;flex-direction:column}

.hero .photo img{object-position:50% 30%}

  .hero .band{padding-top:1rem}
}
@media (min-width:900px){
  .hero .photo{left:36%}
  .hero .photo::after{background:linear-gradient(90deg,var(--navy) 0%,rgba(24,48,68,.55) 12%,rgba(24,48,68,0) 30%),linear-gradient(180deg,rgba(24,48,68,.35) 0%,rgba(24,48,68,0) 20%),linear-gradient(180deg,rgba(24,48,68,0) 62%,rgba(24,48,68,.75) 88%,var(--navy) 100%)!important}
  .hero .band h1{font-size:clamp(2.1rem,4.2vw,3.6rem);max-width:13ch}
  .hero .band p.lead{max-width:34ch}
  .hero .band .row{flex-direction:column;align-items:flex-start;gap:1.5rem}
}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,48,68,.7) 0%,rgba(24,48,68,0) 28%),linear-gradient(90deg,rgba(24,48,68,.82) 0%,rgba(24,48,68,.55) 40%,rgba(24,48,68,0) 68%),linear-gradient(180deg,rgba(24,48,68,0) 45%,rgba(24,48,68,.6) 78%,var(--navy) 100%)}
.band h1,.band p.lead{text-shadow:0 2px 18px rgba(24,48,68,.55)}
@media (max-width:700px){.hero .photo::after{background:linear-gradient(180deg,rgba(24,48,68,.75) 0%,rgba(24,48,68,.3) 22%,rgba(24,48,68,.35) 30%,rgba(24,48,68,.85) 60%,var(--navy) 100%)}}
.badge{position:relative;z-index:1;align-self:flex-start;padding:clamp(1.25rem,3vw,2rem) clamp(2rem,6vw,4.5rem) 0;padding-top:max(clamp(1.25rem,3vw,2rem),env(safe-area-inset-top))}
.badge img{width:min(320px,64vw);height:auto;filter:drop-shadow(0 2px 10px rgba(24,48,68,.45))}
.band{position:relative;z-index:1;margin-top:auto;padding:clamp(2rem,6vw,4.5rem);padding-bottom:max(2.5rem,env(safe-area-inset-bottom));color:var(--white)}
.band h1{font-family:var(--sans);font-weight:700;font-size:clamp(2.1rem,5.5vw,4.25rem);line-height:1.05;letter-spacing:-.02em;max-width:14ch;margin-bottom:1.25rem}
.band p.lead{font-size:1.125rem;line-height:1.6;max-width:44ch;color:rgba(255,255,255,.88);margin-bottom:2rem}
.band .row{display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem 2.5rem}
.band .foot{color:rgba(255,255,255,.7);max-width:40ch}
.donate:focus-visible{outline-color:var(--white)}
.fb{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--sans);font-weight:600;font-size:1rem;color:var(--white);
  text-decoration:none;padding:.95rem 1.6rem;border-radius:999px;border:2px solid rgba(255,255,255,.7);transition:background .15s ease,border-color .15s ease}
.fb:hover{background:rgba(255,255,255,.12);border-color:var(--white)}
.fb:focus-visible{outline:3px solid var(--white);outline-offset:4px}
.fb svg{width:20px;height:20px;fill:currentColor}
.btns{display:flex;flex-wrap:wrap;gap:.9rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
